<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer Navy Gradient -->
    <radialGradient id="nssNavy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="100%" stop-color="#07172B" />
    </radialGradient>
    <!-- Red Energetic Youth Core -->
    <radialGradient id="nssRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </radialGradient>
    <path id="textCircleTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
    <path id="textCircleBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  </defs>

  <!-- Outer Ring (Navy) -->
  <circle cx="100" cy="100" r="98" fill="url(#nssNavy)" stroke="#FFFFFF" stroke-width="2.5" />
  
  <!-- Outer Gold/White Beaded Track -->
  <circle cx="100" cy="100" r="91" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Outer Text: NATIONAL SERVICE SCHEME -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="900" fill="#FFFFFF" letter-spacing="2.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      NATIONAL SERVICE SCHEME
    </textPath>
  </text>

  <!-- Bottom Text: NOT ME BUT YOU -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FDE047" letter-spacing="3">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ★ NOT ME BUT YOU ★
    </textPath>
  </text>

  <!-- Inner Navy Rim -->
  <circle cx="100" cy="100" r="62" fill="#07172B" stroke="#FFFFFF" stroke-width="2" />

  <!-- Konark Wheel Main Red Field -->
  <circle cx="100" cy="100" r="56" fill="url(#nssRed)" stroke="#FDE047" stroke-width="2" />

  <!-- The 8 Main Konark Rath Wheel Spokes (Representing 24 hours of round-the-clock service) -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="46" x2="100" y2="154" />
    <line x1="46" y1="100" x2="154" y2="100" />
    <line x1="62" y1="62" x2="138" y2="138" />
    <line x1="138" y1="62" x2="62" y2="138" />
  </g>

  <!-- Secondary minor spokes -->
  <g stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
    <line x1="100" y1="48" x2="100" y2="152" transform="rotate(22.5 100 100)" />
    <line x1="100" y1="48" x2="100" y2="152" transform="rotate(67.5 100 100)" />
    <line x1="100" y1="48" x2="100" y2="152" transform="rotate(112.5 100 100)" />
    <line x1="100" y1="48" x2="100" y2="152" transform="rotate(157.5 100 100)" />
  </g>

  <!-- Concentric Inner Navy Hub Track -->
  <circle cx="100" cy="100" r="34" fill="#07172B" stroke="#FFFFFF" stroke-width="1.75" />

  <!-- Outer Spoke Nodes / Beads (24 hours beads) -->
  <g fill="#FFFFFF">
    <circle cx="100" cy="52" r="2.8" />
    <circle cx="134" cy="66" r="2.8" />
    <circle cx="148" cy="100" r="2.8" />
    <circle cx="134" cy="134" r="2.8" />
    <circle cx="100" cy="148" r="2.8" />
    <circle cx="66" cy="134" r="2.8" />
    <circle cx="52" cy="100" r="2.8" />
    <circle cx="66" cy="66" r="2.8" />
  </g>

  <!-- Central Wheel Hub -->
  <circle cx="100" cy="100" r="16" fill="url(#nssRed)" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="100" cy="100" r="6" fill="#FDE047" stroke="#07172B" stroke-width="1.5" />
</svg>
